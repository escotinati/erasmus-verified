<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Alojamiento — Erasmus Verified</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
            rel="stylesheet"
        />
        <!-- Design System tokens -->
        <link rel="stylesheet" href="/src/styles/tokens.css" />
        <link rel="stylesheet" href="/src/styles/typography.css" />
        <link rel="stylesheet" href="/src/css/styles.css" />
        <link rel="stylesheet" href="/src/css/animations.css" />
        <script src="/src/js/experience.js"></script>
        <script>
            if (window.ERASMUS_EXPERIENCE.theme === 'theme-parties') {
                window.location.replace('index.html');
            }
        </script>
    </head>

    <body class="alojamientos-page">
        <!-- ── TOP NAV (React, rama react/menu) — ver src/react/TopbarNav.jsx ── -->
        <div id="nav-root"></div>
        <script type="module" src="/src/react/mount-topbar-nav.jsx"></script>

        <main style="flex: 1">
            <section class="nights-section">
                <div class="nights-header">
                    <span
                        class="eyebrow eyebrow--primary anim-page-enter"
                        data-i18n="accommodation.eyebrow"
                        >ALOJAMIENTO VERIFICADO</span
                    >
                    <h1 class="section-title anim-page-enter" data-i18n="accommodation.title">
                        Encuentra tu hogar Erasmus
                    </h1>
                    <p class="section-sub anim-page-enter" data-i18n="accommodation.subtitle">
                        Alojamiento verificado y gestionado directamente por nuestro equipo, en
                        toda Europa. Reserva con confianza.
                    </p>
                </div>

                <!-- Fichas individuales (alojamiento.html?id=ID) — ver
                     ListingDetail.jsx/FeaturedListings.jsx. Única
                     sección de la página: ya no hay "Plataformas
                     colaboradoras" (CollabGrid.jsx) — todo alojamiento
                     está gestionado directamente por Erasmus Verified,
                     sin terceros. Sin clase "events-scroll" en este div:
                     FeaturedListings.jsx pinta esa rejilla DENTRO de su
                     propio render (comparte estado con la barra de
                     filtro, ver el componente). -->
                <div data-featured-listings="alojamiento" data-animate></div>
            </section>
        </main>

        <!-- FOOTER (React, rama react/menu) — ver src/react/Footer.jsx -->
        <div id="footer-root"></div>
        <script type="module" src="/src/react/mount-footer.jsx"></script>
        <script type="module" src="/src/react/mount-featured-listings.jsx"></script>

        <!-- Mobile-nav overlay: ahora vive en src/react/TopbarNav.jsx (rama react/menu) -->

        <!-- ── APP BOTTOM NAV (React) — ver src/react/AppShell.jsx ── -->
        <div id="shell-root"></div>
        <script type="module" src="/src/react/mount-shell.jsx"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
        <script src="/src/js/lib/supabaseClient.js"></script>
        <script src="/src/utils/i18n.js"></script>
        <script src="/src/utils/translations.js"></script>
        <script src="/src/js/langSwitcher.js"></script>
        <script src="/src/js/utils/speculationRules.js"></script>
        <script src="/src/js/utils/sanitize.js"></script>
        <script src="/src/js/services/authService.js"></script>
        <script src="/src/js/utils/animations.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                window.I18n.applyTranslations();
                if (window.initScrollReveal) window.initScrollReveal();
            });
        </script>
    </body>
</html>
