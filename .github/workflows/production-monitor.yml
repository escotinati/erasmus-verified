# Vigila PRODUCCIÓN cada día: que las cabeceras de seguridad sigan ahí y que los
# permisos de la base de datos para un visitante anónimo no se hayan abierto.
# Si algo falla, GitHub te avisa por correo (Settings > Notifications > Actions).
name: Seguridad (producción)

on:
  schedule:
    - cron: '0 7 * * *'   # cada día 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cabeceras:
    name: Cabeceras HTTP y CSP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comprobar cabeceras
        run: bash scripts/ci/check-headers.sh "${{ vars.PRODUCTION_URL || 'https://erasmus-verified.vercel.app' }}"

  permisos-anonimos:
    name: Permisos anónimos en Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Antes este job se omitía (quedaba en gris) si faltaba SUPABASE_ANON_KEY,
    # y eso parecía "todo bien" sin vigilar nada. Ahora el job SIEMPRE corre,
    # y si falta la variable, falla en rojo con instrucciones de cómo crearla.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comprobar que la variable SUPABASE_ANON_KEY existe
        run: |
          if [ -z "${{ vars.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Falta la variable de repositorio SUPABASE_ANON_KEY, así que no se pueden comprobar los permisos anónimos de Supabase."
            echo "::error::Créala en Settings > Secrets and variables > Actions > pestaña Variables > New repository variable."
            echo "::error::Nombre exacto: SUPABASE_ANON_KEY. Valor: la clave pública anon o sb_publishable_... del proyecto (nunca la service_role)."
            exit 1
          fi
      - name: Comprobar permisos con la clave anon
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://puivkbjgbfnlpepyednt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: bash scripts/ci/check-rls-anon.sh
