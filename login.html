<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Iniciar sesión — Erasmus Verified</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
            rel="stylesheet"
        />
        <!-- Design System tokens -->
        <link rel="stylesheet" href="/src/styles/tokens.css" />
        <link rel="stylesheet" href="/src/styles/typography.css" />
        <link rel="stylesheet" href="/src/css/styles.css" />
        <link rel="stylesheet" href="/src/css/animations.css" />
        <script src="/src/js/experience.js"></script>
    </head>

    <body class="auth-page auth-page--login">
        <!-- Fondo degradado a pantalla completa (fixed, detrás de todo el
             contenido) — ver .auth-bg en auth.css. Fuera de <main> a
             propósito: cubre todo el viewport (nav + footer incluidos),
             no solo el ancho de .auth-section. auth-page--login (junto al
             equivalente auth-page--register de registro.html) es lo que
             hace que el blob índigo gane presencia sobre el magenta —
             ver la nota junto a esas reglas en auth.css. -->
        <div class="auth-bg" aria-hidden="true">
            <div class="auth-bg-glow auth-bg-glow--1"></div>
            <div class="auth-bg-glow auth-bg-glow--2"></div>
        </div>

        <!-- ── TOP NAV (React, rama react/menu) — ver src/react/TopbarNav.jsx ── -->
        <div id="nav-root"></div>
        <script type="module" src="/src/react/mount-topbar-nav.jsx"></script>

        <main style="flex: 1">
            <div class="section auth-section auth-section--card">
                <div class="auth-card auth-card--glass anim-fade-up anim-delay-1">
                    <!-- Selector Iniciar sesión / Crear cuenta — sustituye al
                         antiguo enlace "¿No tienes cuenta? Regístrate": son dos
                         <a> reales (navegación normal a registro.html), no un
                         toggle de JS. El "salto" entre esta tarjeta y la de
                         registro.html se resuelve con las View Transitions ya
                         activadas en el sitio (transitions.css) — ambas páginas
                         comparten los mismos view-transition-name en la píldora,
                         la tarjeta y el fondo, así que el navegador anima la
                         píldora deslizándose y la tarjeta cambiando de alto en
                         vez de recargar de golpe. -->
                    <nav class="auth-switcher" aria-label="Iniciar sesión o crear cuenta">
                        <span class="auth-switcher__pill" aria-hidden="true"></span>
                        <a
                            href="login.html"
                            class="auth-switcher__tab"
                            aria-current="page"
                            data-i18n="auth.login_submit_cta"
                            >Iniciar sesión</a
                        >
                        <a
                            href="registro.html"
                            class="auth-switcher__tab"
                            data-i18n="auth.register_submit_cta"
                            >Crear cuenta</a
                        >
                    </nav>

                    <div class="auth-card__head">
                        <h1 class="auth-card__title anim-page-enter" data-i18n="auth.login_title">
                            Bienvenido de nuevo
                        </h1>
                        <p class="auth-card__sub anim-page-enter" data-i18n="auth.login_subtitle">
                            Accede con tu email y contraseña para continuar.
                        </p>
                    </div>

                    <form id="login-form" class="auth-form" novalidate>
                        <div class="auth-field">
                            <label for="login-email" data-i18n="auth.email_label">Email</label>
                            <input
                                id="login-email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                required
                                aria-describedby="login-email-error"
                                data-i18n="auth.email_placeholder"
                                placeholder="tucorreo@ejemplo.com"
                            />
                        </div>

                        <div class="auth-field">
                            <label for="login-password" data-i18n="auth.password_label"
                                >Contraseña</label
                            >
                            <div class="auth-input-group auth-input-group--password">
                                <input
                                    id="login-password"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    required
                                    aria-describedby="login-password-error"
                                />
                                <button
                                    type="button"
                                    id="login-password-toggle"
                                    class="auth-password-toggle"
                                >
                                    <span
                                        class="material-symbols-outlined"
                                        id="login-password-toggle-icon"
                                        aria-hidden="true"
                                        >visibility</span
                                    >
                                </button>
                            </div>
                            <p class="auth-forgot">
                                <a href="recuperar.html" data-i18n="auth.forgot_password_link"
                                    >¿Olvidaste tu contraseña?</a
                                >
                            </p>
                        </div>

                        <button
                            type="submit"
                            class="btn-primary-pill"
                            id="login-submit"
                            data-i18n="auth.login_submit_cta"
                        >
                            Iniciar sesión
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <!-- FOOTER (React, rama react/menu) — ver src/react/Footer.jsx -->
        <div id="footer-root"></div>
        <script type="module" src="/src/react/mount-footer.jsx"></script>

        <!-- ── APP BOTTOM NAV (React) — ver src/react/AppShell.jsx ── -->
        <div id="shell-root"></div>
        <script type="module" src="/src/react/mount-shell.jsx"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
        <script src="/src/js/lib/supabaseClient.js"></script>
        <script src="/src/utils/i18n.js"></script>
        <script src="/src/utils/translations.js"></script>
        <script src="/src/js/langSwitcher.js"></script>
        <script src="/src/js/utils/speculationRules.js"></script>
        <script src="/src/js/utils/sanitize.js"></script>
        <script src="/src/js/services/authService.js"></script>
        <script src="/src/js/utils/animations.js"></script>
        <script src="/src/js/login.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                window.I18n.applyTranslations();
                if (window.initScrollReveal) window.initScrollReveal();
            });
        </script>
    </body>
</html>
